<section >
  <div class="header rounded-2">
    <p><span class="text-black"><i class="fa-solid fa-angle-left me-1"></i></span> View All Projects</p>
    <h3 class="fw-normal">Add a New Project</h3>
  </div>
  <div class="col-9 mx-auto bg-white rounded-3 my-3 p-4">
    <div>
      <mat-form-field class="example-full-width w-100 rounded-3 overflow-hidden">
        <mat-label>Name</mat-label>
        <input matInput placeholder="Enter project name" type="text" formControlName="Name">
      </mat-form-field>
    </div>
    <div>
      <mat-form-field class="example-full-width w-100 rounded-3 overflow-hidden">
        <mat-label>Description</mat-label>
        <textarea matInput placeholder="description"  formControlName="description"></textarea>
      </mat-form-field>
    </div>
    <hr>
    <div class="d-flex justify-content-between">
      <button class="btn border-1 btn-outline-dark rounded-5 py-2 px-4">Cancel</button>
      <button class="button">Save</button>
    </div>
  </div>
</section>
