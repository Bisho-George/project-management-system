<section>
  <div class="container">
    <div class="row">
      <div class="col-md-7 m-auto auth-form ">
        <div class="d-flex justify-content-center">
          <img class="w-50" src="../../../../../assets/images/logo.svg" alt="">
        </div>
        <div class="content">
          <p class="text-white mb-0">welcome to PMS</p>
          <h3 class="main-color fs-1">Verify Account</h3>
          <form [formGroup]="verifyForm" (ngSubmit)="onVerify()">
            <div class=" mb-3">
              <label for="email" class="main-color">E-mail</label>
              <input readonly type="email" class="form-control  " id="email" placeholder="Email" aria-label="Email"
                formControlName="email" aria-describedby="basic-addon1">
            </div>
            <ng-container *ngIf="email?.dirty || email?.touched">
              <p class="text-danger" *ngIf="email?.errors?.['required']">The email is required</p>
              <p class="text-danger" *ngIf="email?.errors?.['email']">
                Email is not valid</p>
            </ng-container>
            <div class=" mb-3">
              <label for="otp" class="main-color">OTP Verification</label>
              <input type="text" class="form-control textfield-background" id="otp" placeholder="Otp" aria-label="Otp"
                formControlName="code" aria-describedby="basic-addon1">
            </div>
            <ng-container *ngIf="code?.dirty || code?.touched">
              <p class="text-danger" *ngIf="code?.errors?.['required']">The code is required</p>
            </ng-container>
            <p class="text-danger">{{error}}</p>
            {{error}}
            <button [disabled]="verifyForm.invalid" class="button main-btn">Save</button>
          </form>
        </div>

      </div>
    </div>
  </div>
</section>
