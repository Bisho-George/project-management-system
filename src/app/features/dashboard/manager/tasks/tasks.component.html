<section *ngIf="resData.length > 0">
  <app-header-section title="Tsks" buttonName="Add new task"></app-header-section>
<div class="container">
    <div class="row">
      <mat-card class="py-4">
          <mat-form-field class="mdc-text-field-outlined rounded-full" appearance="outline">
            <mat-label>Search</mat-label>
            <input [(ngModel)]="searchValue" (keydown.enter)="getProjects()" matInput placeholder="Search fleets">
            <mat-icon matPrefix>search</mat-icon>
            <mat-icon (click)="clearFilter()" *ngIf="searchValue !== ''" matSuffix>close</mat-icon>
        </mat-form-field>
        <app-table (pageChange)="onPageChange($event)" [tableData]="tableData"></app-table>
      </mat-card>
    </div>
  </div>
</section>
<section *ngIf="resData.length ==  0" class="h-100">
  <div class="h-75 d-flex justify-content-center align-items-center ">
    <div>
      <div class="w-75 mx-auto">
        <img src="../../../../../assets/images/noDataImage.png" alt="" class="w-100">
       </div>
       <div class="text-center my-2 text-black">
        <h3 class="fs-1 fw-semibold">No Data !</h3>
        <p class="light-gray">are you sure you want to delete this item ? if you are sure just <br> click on delete it</p>
       </div>
    </div>


  </div>

</section>
