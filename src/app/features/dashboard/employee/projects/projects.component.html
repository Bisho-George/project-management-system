<section>
  <div class="container-fluid" >
      <div class="row">
        <mat-card class="py-4">
            <mat-form-field class="mdc-text-field-outlined rounded-full" appearance="outline">
              <mat-label>Search</mat-label>
              <input [(ngModel)]="searchValue" (keydown.enter)="getProjects()" matInput placeholder="Search fleets">
              <mat-icon matPrefix>search</mat-icon>
              <mat-icon (click)="clearFilter()" *ngIf="searchValue !== ''" matSuffix>close</mat-icon>
          </mat-form-field>
          <app-table (pageChange)="onPageChange($event)" [tableData]="tableData" *ngIf="tableData.data.data.length >  0"></app-table>
        </mat-card>
      </div>
    </div>
  </section>
